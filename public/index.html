<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>서울형 키즈카페 실시간 예약 현황 모니터링</title>
  <meta name="description" content="서울시 내 모든 자치구의 서울형 키즈카페 실시간 공석 현황을 파악하고 주기적으로 모니터링하는 세련된 대시보드 서비스입니다.">
  <link rel="stylesheet" href="index.css">
  <!-- Google Fonts Outfit & Inter -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;700&display=swap" rel="stylesheet">
</head>
<body>
  <header>
    <div class="logo">
      <span class="icon">🎪</span>
      <h1>Kids Cafe Live</h1>
    </div>
    <div class="header-controls">
      <button id="sidebar-toggle" class="btn btn-secondary">🔍 지역/지점 선택</button>
      <button id="search-now-btn" class="btn btn-secondary">⚡ 조회</button>
      <button id="monitor-toggle" class="btn btn-inactive">● 모니터링 중지됨</button>
      <div class="select-wrapper">
        <select id="interval-select" aria-label="갱신 주기 선택">
          <option value="30">30초 주기</option>
          <option value="60" selected>1분 주기</option>
          <option value="180">3분 주기</option>
        </select>
      </div>
      <button id="mute-toggle" class="btn btn-secondary">🔊 소리 켬</button>
      <span id="last-update" class="status-time">최근 갱신: 없음</span>
    </div>
  </header>
  
  <main>
    <div id="sidebar-overlay" class="sidebar-overlay"></div>
    <aside id="sidebar" aria-label="지역 및 지점 필터">
      <h2>자치구 선택</h2>
      <div class="search-box-wrapper">
        <input type="text" id="cafe-search" placeholder="🔍 키즈카페 검색..." aria-label="키즈카페명 검색">
      </div>
      <div id="regions-container" class="accordion-container"></div>
    </aside>
    
    <section id="content" aria-label="예약 현황 매트릭스">
      <div class="filters-panel">
        <label class="checkbox-label">
          <input type="checkbox" id="filter-weekend" checked>
          <span class="custom-checkbox"></span>
          주말만 보기
        </label>
        <label class="checkbox-label">
          <input type="checkbox" id="filter-available">
          <span class="custom-checkbox"></span>
          공석 있는 날짜만 보기
        </label>
        <div class="date-picker-wrapper">
          <input type="date" id="filter-date" aria-label="조회 일자 지정">
        </div>
      </div>
      
      <div id="matrix-container" class="matrix-wrapper">
        <table id="matrix-table">
          <thead>
            <tr id="matrix-header">
              <!-- Dynamically populated -->
            </tr>
          </thead>
          <tbody id="matrix-body">
            <!-- Dynamically populated -->
          </tbody>
        </table>
        <div id="empty-state" class="empty-state">
          <p>좌측 패널에서 조회하고자 하는 키즈카페를 선택하세요.</p>
        </div>
      </div>
    </section>
  </main>
  
  <audio id="chime-audio" src="https://assets.mixkit.co/active_storage/sfx/2869/2869-500.wav" preload="auto"></audio>
  <script src="app.js" type="module"></script>
</body>
</html>
